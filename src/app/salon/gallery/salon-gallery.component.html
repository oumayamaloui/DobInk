<div class="container py-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold">Galerie</h2>
    <p class="text-muted">Un aperçu de notre univers.</p>
  </div>
  <div class="row g-3">
    <div class="col-6 col-md-3" *ngFor="let i of [
      'assets/images/1.webp','assets/images/2.webp','assets/images/3.jpg','assets/images/4.png',
      'assets/images/5.jpg','assets/images/6.png','assets/images/7.webp','assets/images/8.webp']">
      <img [src]="i" class="img-fluid rounded-3 shadow-sm" alt="gallery">
    </div>
  </div>
</div>
